[package]
name = "patchbay-core"
description = "Probes for local developer CLI auth state: status, switch, verify, permissions"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
# `preserve_order` is load-bearing for `mcp_clients`: rewriting an AI client's
# config must not reshuffle its keys into alphabetical order.
serde_json = { workspace = true, features = ["preserve_order"] }
chrono.workspace = true
serde_yaml_ng = "0.10"
toml = "0.9"
# Format-preserving TOML, for Codex's config.toml: comments, ordering and the
# user's own layout survive a write.
toml_edit = "0.23"
which = "8"
rusqlite = { version = "0.40", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
