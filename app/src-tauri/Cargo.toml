[package]
name = "patchbay-app"
description = "patchbay — the desktop panel for your CLI logins"
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/pathorsAI/patchbay"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (a hard
# requirement on Windows: rust-lang/cargo#8519).
name = "patchbay_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
patchbay-core = { path = "../../crates/patchbay-core" }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
