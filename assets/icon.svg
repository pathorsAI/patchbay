<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16221F"/>
      <stop offset="1" stop-color="#0B1213"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.28" r="0.75">
      <stop offset="0" stop-color="#55B5BB" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#55B5BB" stop-opacity="0"/>
    </radialGradient>
    <filter id="cshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="184"/></clipPath>
  </defs>

  <!-- ground -->
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#glow)"/>
  <rect x="103" y="103" width="818" height="818" rx="181" fill="none" stroke="#3A4849" stroke-opacity="0.55" stroke-width="3"/>

  <g clip-path="url(#sq)">
    <!-- 3x3 jack grid: rings + holes -->
    <g>
      <g fill="none" stroke="#2E3A3B" stroke-width="16">
        <circle cx="272" cy="272" r="54"/><circle cx="512" cy="272" r="54"/><circle cx="752" cy="272" r="54"/>
        <circle cx="272" cy="512" r="54"/><circle cx="512" cy="512" r="54"/><circle cx="752" cy="512" r="54"/>
        <circle cx="272" cy="752" r="54"/><circle cx="512" cy="752" r="54"/><circle cx="752" cy="752" r="54"/>
      </g>
      <g fill="#060B0C">
        <circle cx="272" cy="272" r="26"/><circle cx="512" cy="272" r="26"/><circle cx="752" cy="272" r="26"/>
        <circle cx="272" cy="512" r="26"/><circle cx="512" cy="512" r="26"/><circle cx="752" cy="512" r="26"/>
        <circle cx="272" cy="752" r="26"/><circle cx="512" cy="752" r="26"/><circle cx="752" cy="752" r="26"/>
      </g>
      <!-- top-light on rings -->
      <g fill="none" stroke="#4A5A5B" stroke-width="5" stroke-linecap="round">
        <path d="M 234 246 A 54 54 0 0 1 310 246"/><path d="M 474 246 A 54 54 0 0 1 550 246"/><path d="M 714 246 A 54 54 0 0 1 790 246"/>
        <path d="M 234 486 A 54 54 0 0 1 310 486"/><path d="M 474 486 A 54 54 0 0 1 550 486"/><path d="M 714 486 A 54 54 0 0 1 790 486"/>
        <path d="M 234 726 A 54 54 0 0 1 310 726"/><path d="M 474 726 A 54 54 0 0 1 550 726"/><path d="M 714 726 A 54 54 0 0 1 790 726"/>
      </g>
    </g>

    <!-- warm cable: bottom-center jack to top-right jack -->
    <g filter="url(#cshadow)">
      <path d="M 512 752 C 660 830, 850 560, 752 272" fill="none" stroke="#CFA04A" stroke-width="36" stroke-linecap="round"/>
    </g>
    <circle cx="512" cy="752" r="42" fill="#CFA04A"/><circle cx="512" cy="752" r="16" fill="#3A2D10"/>
    <circle cx="752" cy="272" r="42" fill="#CFA04A"/><circle cx="752" cy="272" r="16" fill="#3A2D10"/>

    <!-- teal cable: top-left jack to middle-right jack (drawn last = on top) -->
    <g filter="url(#cshadow)">
      <path d="M 272 272 C 330 580, 620 680, 752 512" fill="none" stroke="#55B5BB" stroke-width="36" stroke-linecap="round"/>
    </g>
    <circle cx="272" cy="272" r="42" fill="#55B5BB"/><circle cx="272" cy="272" r="16" fill="#0E2A2C"/>
    <circle cx="752" cy="512" r="42" fill="#55B5BB"/><circle cx="752" cy="512" r="16" fill="#0E2A2C"/>
  </g>
</svg>
