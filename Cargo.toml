[workspace]
resolver = "2"
members = [
    "crates/patchbay-core",
    "crates/patchbay-cli",
    "crates/patchbay-mcp",
]
# The Tauri app is its own crate with its own lockfile: `tauri build` wants to
# own the target dir and the dependency graph of the shell it generates.
exclude = ["app/src-tauri"]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/pathorsAI/patchbay"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
patchbay-core = { path = "crates/patchbay-core" }
